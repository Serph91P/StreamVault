[build-system]
requires = ["setuptools==80.9.0", "setuptools-scm==9.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamvault"
dynamic = ["version"]
description = "Self-hosted Twitch recorder, live player, and media library"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy[postgresql]==2.1.8",
    "psycopg[binary]==3.3.8",
    "psycopg-pool==3.3.3",
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "greenlet==3.5.6",
    "python-dotenv==1.2.4",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "PyJWT==2.15.1",
    "oauthlib==4.0.1",
    "bcrypt==5.0.0",
    "python-multipart==0.0.33",
    "pydantic-settings==2.16.2",
    "aiohttp==3.14.5",
    "aiofiles==25.1.0",
    "httpx==0.28.1",
    "pillow==13.0.0",
    "apprise==1.13.1",
    "py-vapid==1.9.6",
    "psutil==7.2.2",
    "cachetools==7.3.0",
    "streamlink==8.6.3",
    "http-ece==1.2.1",
]

[dependency-groups]
dev = ["pre-commit==4.7.0", "ruff==0.17.4"]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "pytest-cov==6.2.1"]
typing = [
    "mypy==1.17.1",
    "types-psutil==7.2.2.20261111",
]
security = ["bandit[toml]==1.9.4", "pip-audit==2.10.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"
local_scheme = "no-local-version"
version_scheme = "no-guess-dev"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = [
    "app/config/settings.py",
    "app/database.py",
    "app/core/exceptions.py",
    "app/middleware/logging.py",
    "app/observability.py",
    "app/routes/health.py",
    "app/routes/logging.py",
    "app/routes/migration.py",
    "app/routes/settings.py",
    "app/routes/status.py",
    "app/routes/images.py",
    "app/routes/api_images.py",
    "app/services/init/startup_init.py",
    "app/services/system/logging_service.py",
    "app/services/recording/recording_logger.py",
    "app/utils/path_utils.py",
    "app/utils/async_db_utils.py",
    "app/utils/async_file.py",
    "app/utils/proxy_encryption.py",
    "app/services/recording/admin_cleanup.py",
    "app/services/core/automated_recovery_state.py",
    "app/services/simple_recovery_service.py",
    "app/bootstrap/__init__.py",
    "app/bootstrap/application.py",
    "app/bootstrap/settings.py",
    "app/bootstrap/storage.py",
    "app/events/event_catalog.py",
    "app/events/handler_registry.py",
    "app/tasks/websocket_broadcast_task.py",
    "app/models/identity.py",
    "app/models/notifications.py",
    "app/models/proxies.py",
    "app/models/recordings.py",
    "app/models/streams.py",
    "app/models/system.py",
    "app/models/upstream.py",
    "app/services/core/session_maintenance.py",
    "app/services/core/state_values.py",
    "app/services/core/state_persistence_service.py",
    "app/services/http_client.py",
    "app/services/api/twitch_api.py",
    "app/services/media/metadata_service.py",
    "app/services/media/artwork_service.py",
    "app/services/media/thumbnail_service.py",
    "app/services/processing/status_values.py",
    "app/services/processing/post_processing_task_handlers.py",
    "app/services/notifications/push_notification_service.py",
    "app/services/notifications/external_notification_service.py",
    "app/services/proxy/proxy_catalog.py",
    "app/services/proxy/proxy_health_service.py",
    "app/services/recording/configuration_values.py",
    "app/services/recording/config_manager.py",
    "app/services/recording/file_operations.py",
    "app/services/recording/recording_values.py",
    "app/services/recording/recording_database_service.py",
    "app/services/recording/recording_state_manager.py",
    "app/services/recording/recording_lifecycle_manager.py",
    "app/services/recording/process_manager.py",
    "app/services/recording/unified_recovery_service.py",
    "app/services/recording/orphaned_recovery_service.py",
    "app/services/recording/orphaned_recovery_tasks.py",
    "app/services/system/twitch_token_service.py",
    "app/services/system/supervisor.py",
    "app/services/system/streamlink_config_service.py",
    "app/services/images/image_refresh_service.py",
    "app/services/images/image_sync_service.py",
    "app/services/images/auto_image_sync_service.py",
    "app/services/images/profile_image_service.py",
    "app/services/images/banner_image_service.py",
    "app/services/images/category_image_service.py",
    "app/services/images/stream_artwork_service.py",
    "app/services/images/image_download_service.py",
    "app/services/streamers/values.py",
    "app/services/system/temporary_cleanup_service.py",
    "app/utils/process_output.py",
    "app/utils/ffmpeg_utils.py",
    "app/utils/remux_staging.py",
]
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

# Strict per-module flags; the original legacy roots and exclusions stay unchanged.
[[tool.mypy.overrides]]
module = [
    "app.bootstrap", "app.bootstrap.application", "app.bootstrap.settings", "app.bootstrap.storage",
    "app.events.event_catalog",
    "app.database",
    "app.events.handler_registry", "app.tasks.websocket_broadcast_task",
    "app.routes.logging", "app.routes.migration",
    "app.routes.settings",
    "app.routes.status",
    "app.routes.images", "app.routes.api_images",
    "app.services.init.startup_init",
    "app.models.identity", "app.models.notifications", "app.models.proxies", "app.models.recordings",
    "app.models.streams", "app.models.system", "app.models.upstream",
    "app.services.core.automated_recovery_state", "app.services.core.session_maintenance", "app.services.core.state_values",
    "app.services.http_client", "app.services.processing.status_values", "app.services.proxy.proxy_catalog",
    "app.services.api.twitch_api",
    "app.services.media.metadata_service", "app.services.media.artwork_service", "app.utils.process_output",
    "app.services.media.thumbnail_service",
    "app.utils.async_file",
    "app.utils.proxy_encryption", "app.services.notifications.push_notification_service",
    "app.services.notifications.external_notification_service",
    "app.services.proxy.proxy_health_service",
    "app.services.recording.admin_cleanup", "app.services.recording.configuration_values", "app.services.recording.recording_values", "app.services.recording.recording_database_service",
    "app.services.recording.config_manager",
    "app.services.recording.file_operations", "app.services.core.state_persistence_service",
    "app.services.recording.recording_state_manager", "app.utils.ffmpeg_utils", "app.utils.remux_staging",
    "app.services.recording.recording_lifecycle_manager",
    "app.services.recording.process_manager",
    "app.services.processing.post_processing_task_handlers",
    "app.services.simple_recovery_service", "app.services.streamers.values", "app.services.system.temporary_cleanup_service",
    "app.services.recording.unified_recovery_service", "app.services.system.twitch_token_service", "app.services.images.image_refresh_service",
    "app.services.recording.orphaned_recovery_service",
    "app.services.recording.orphaned_recovery_tasks",
    "app.services.system.supervisor",
    "app.services.system.streamlink_config_service",
    "app.services.images.image_sync_service", "app.services.images.auto_image_sync_service",
    "app.services.images.profile_image_service", "app.services.images.banner_image_service",
    "app.services.images.category_image_service", "app.services.images.stream_artwork_service",
    "app.services.images.image_download_service",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["py_vapid", "py_vapid.*"]
ignore_missing_imports = true
