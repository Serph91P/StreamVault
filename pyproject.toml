[build-system]
requires = ["setuptools==80.9.0", "setuptools-scm==9.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamvault"
dynamic = ["version"]
description = "Self-hosted Twitch recorder, live player, and media library"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "SQLAlchemy[postgresql]==2.0.52",
    "psycopg[binary]==3.3.5",
    "psycopg-pool==3.3.1",
    "aiosqlite==0.22.1",
    "alembic==1.19.2",
    "greenlet==3.5.5",
    "python-dotenv==1.2.3",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.1",
    "PyJWT==2.13.0",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "pydantic-settings==2.15.0",
    "aiohttp==3.14.3",
    "aiofiles==25.1.0",
    "httpx==0.28.1",
    "pillow==12.3.0",
    "apprise==1.13.1",
    "py-vapid==1.9.4",
    "psutil==7.2.2",
    "cachetools==7.1.8",
    "streamlink==8.4.0",
]

[dependency-groups]
dev = ["pre-commit==4.3.0", "ruff==0.15.1"]
test = ["pytest==9.1.1", "pytest-asyncio==1.3.0", "pytest-cov==6.2.1"]
typing = ["mypy==1.17.1"]
security = ["bandit[toml]==1.9.4", "pip-audit==2.9.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"
local_scheme = "no-local-version"
version_scheme = "no-guess-dev"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.14"
files = [
    "app/config/settings.py",
    "app/core/exceptions.py",
    "app/middleware/logging.py",
    "app/observability.py",
    "app/routes/health.py",
]
follow_imports = "skip"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["py_vapid", "py_vapid.*"]
ignore_missing_imports = true
