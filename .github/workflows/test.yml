name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Prevent concurrent test runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Backend Tests (Python)
  # ──────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install locked test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.6
          uv lock --check
          uv sync --locked --all-groups --reinstall-package streamvault

      - name: Run backend tests with coverage
        run: |
          uv run pytest tests/ -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --tb=short

      - name: Check migration orchestration
        run: >
          uv run pytest -v --tb=short
          tests/test_migration_foundation.py
          tests/test_migration_service_orchestration.py

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Archive coverage report
        if: always() && hashFiles('htmlcov/index.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-coverage-report
          path: htmlcov/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Frontend Build & Lint (Vue 3 + TypeScript)
  # ──────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Lint
    needs: [frontend-core, frontend-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both frontend workers to succeed
        run: |
          test "${{ needs.frontend-core.result }}" = success
          test "${{ needs.frontend-browser.result }}" = success

  frontend-core:
    name: Frontend Core & Real Regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci --prefer-offline

      - name: Check TypeScript/Vue code lint
        working-directory: app/frontend
        run: npm run lint:check

      - name: Lint design tokens (no hardcoded hex/breakpoints/transitions)
        working-directory: app/frontend
        run: |
          npm run lint:tokens
          npm run check:foundation

      - name: Type check TypeScript code
        working-directory: app/frontend
        run: npm run type-check

      - name: Run frontend unit tests and negative foundation gates
        working-directory: app/frontend
        run: |
          npm run test:unit
          npm run test:foundation-gates

      - name: Install Playwright browsers
        working-directory: app/frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend (production)
        working-directory: app/frontend
        run: |
          rm -rf dist || true
          node scripts/build-artifact-provenance.mjs build --mode real

      - name: Run real-build WebSocket transition test
        working-directory: app/frontend
        run: STREAMVAULT_REUSE_VERIFIED_REAL_BUILD=true npx playwright test --config tests/e2e/websocket-setup-transition.playwright.config.ts

      - name: Run real-build system page header regressions
        working-directory: app/frontend
        run: STREAMVAULT_REUSE_VERIFIED_REAL_BUILD=true npx playwright test --config tests/fixtures/issue906-headers.config.ts

      - name: Run real-build long-recording mobile player regressions
        working-directory: app/frontend
        run: npx playwright test --config tests/fixtures/issue894-player.config.ts

      - name: Run real-build Pixel control and chapter regressions
        working-directory: app/frontend
        run: npx playwright test --config tests/fixtures/issue896-player.config.ts

      - name: Run real-build native streamer carousel regressions
        working-directory: app/frontend
        run: npx playwright test --config tests/fixtures/issue903-streamers.config.ts

      - name: Check deterministic frontend build output
        working-directory: app/frontend
        run: |
          npm run test:build-output
          npm run test:output-budgets

      - name: Preserve frontend core failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-core-failures-${{ github.run_attempt }}
          path: |
            app/frontend/test-results/
            app/frontend/foundation-test-results/
          if-no-files-found: ignore
          retention-days: 3

  frontend-browser:
    name: Frontend Browser Regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci --prefer-offline
      - name: Install Playwright browsers
        working-directory: app/frontend
        run: npx playwright install --with-deps
      - name: Build verified mock frontend
        working-directory: app/frontend
        run: node scripts/build-artifact-provenance.mjs build --mode mock

      - name: Run frontend browser tests
        working-directory: app/frontend
        run: |
          STREAMVAULT_REUSE_VERIFIED_MOCK_BUILD=true npx playwright test
          STREAMVAULT_REUSE_VERIFIED_MOCK_BUILD=true npm run test:foundation-capture-integration

      - name: Preserve frontend browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-browser-failures-${{ github.run_attempt }}
          path: |
            app/frontend/test-results/
            app/frontend/foundation-test-results/
          if-no-files-found: ignore
          retention-days: 3

  # Keep artwork coverage isolated without changing the shared job's limits.
  chapter-artwork-regressions:
    name: Chapter Artwork Regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: app/frontend
        run: |
          npm ci --prefer-offline
          npx playwright install --with-deps chromium
      - name: Run REAL-build chapter artwork regressions
        working-directory: app/frontend
        run: npx playwright test --config tests/fixtures/issue902-artwork.config.ts
      - name: Preserve chapter artwork failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chapter-artwork-failures-${{ github.run_attempt }}
          path: app/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 3

  notification-scroll-regressions:
    name: Notification Scroll Regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: app/frontend
        run: |
          npm ci --prefer-offline
          npx playwright install --with-deps chromium
      - name: Verify real-build notification scrolling
        working-directory: app/frontend
        run: npx playwright test --config tests/fixtures/issue904-notifications.config.ts
      - name: Preserve notification browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notification-scroll-failures-${{ github.run_attempt }}
          path: app/frontend/test-results/issue904-notifications/
          if-no-files-found: ignore
          retention-days: 3

  # Keep new Settings regressions isolated from the shared browser job's budget.
  # Both genuine build modes and desktop/mobile contexts remain blocking.
  settings-loader-regressions:
    name: Settings Loader Regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: app/frontend
        run: |
          npm ci --prefer-offline
          npx playwright install --with-deps chromium
      - name: Run real-build Settings loader regressions
        working-directory: app/frontend
        run: STREAMVAULT_SETTINGS_TEST_MODE=real npx playwright test --config tests/fixtures/settings-loader.config.ts
      - name: Run mock-build Settings loader regressions
        working-directory: app/frontend
        run: STREAMVAULT_SETTINGS_TEST_MODE=mock npx playwright test --config tests/fixtures/settings-loader.config.ts

  cleanup-policy-regressions:
    name: Cleanup Policy Persistence Regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install locked dependencies and Chromium
        run: |
          python -m pip install uv==0.11.6
          uv sync --locked --all-groups
          npm ci --prefix app/frontend --prefer-offline
          cd app/frontend && npx playwright install --with-deps chromium
      - name: Build REAL frontend
        working-directory: app/frontend
        run: node scripts/build-artifact-provenance.mjs build --mode real
      - name: Exercise failure, retry and database readback without cleanup
        env:
          TMPDIR: ${{ runner.temp }}
        run: uv run python tests/cleanup_policy_acceptance/run.py --output "$RUNNER_TEMP/cleanup-policy-evidence"
      - name: Preserve policy persistence evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cleanup-policy-persistence
          path: ${{ runner.temp }}/cleanup-policy-evidence/
          if-no-files-found: ignore
          retention-days: 3

  # ──────────────────────────────────────────────
  # Python Lint & Type Check
  # ──────────────────────────────────────────────
  lint-and-typecheck:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install locked typing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.6
          uv lock --check
          uv sync --locked --all-groups --reinstall-package streamvault

      - name: Lint Python code
        run: uv run ruff check app/

      - name: Check Python formatting
        # Keep the untouched legacy application on its existing formatter
        # contract until its own modernization phase; packaging code targets 3.14.
        run: uv run ruff format --check --target-version py313 app/

      - name: Type check Python code
        # The modernized surface is a bounded real gate. Legacy modules remain
        # outside this target until their SQLAlchemy typing migration lands.
        run: uv run mypy

  # ──────────────────────────────────────────────
  # Integration Tests (Docker)
  # ──────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: streamvault:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: base,runtime

      - name: Test fresh PostgreSQL migrations, restart, and HTTP surface
        run: bash tests/run_fresh_postgres_proxy_migrations.sh streamvault:test

  # ──────────────────────────────────────────────
  # Quick Security Scan (inline, for fast feedback)
  # ──────────────────────────────────────────────
  security-scan:
    name: Quick Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'
          TRIVY_JAVA_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-java-db:1'
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-filesystem'
        continue-on-error: true

      - name: Python dependency security check
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.6
          uv lock --check
          uv sync --locked --all-groups --reinstall-package streamvault

          echo "Running dependency audit..."
          uv run pip-audit -r requirements.txt

          echo "Running bandit static analysis..."
          uv run bandit -r app/ -ll -iii --exclude app/__pycache__,app/frontend

      - name: Node dependency audit
        working-directory: app/frontend
        run: |
          bash ../../scripts/ci/npm-audit-with-retry.sh
